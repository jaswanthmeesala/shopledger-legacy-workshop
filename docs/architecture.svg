<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map showing the browser UI, Express routers, library modules, config, JSON data store, and the order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:14px;fill:#64748b}.section{font-size:15px;font-weight:700;letter-spacing:1.2px;fill:#475569}.boxTitle{font-size:16px;font-weight:700}.small{font-size:13px;fill:#526176}.tiny{font-size:11px;fill:#526176}.flowText{font-size:13px;font-weight:700;fill:#1d4ed8}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#flowArrow)}.dash{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="54" y="58" class="title">ShopLedger | Application architecture</text>
  <text x="56" y="84" class="subtitle">Browser POS and back office · Express API · JSON file persistence</text>

  <!-- UI -->
  <text x="56" y="127" class="section">BROWSER UI · public/</text>
  <rect x="55" y="143" width="1490" height="118" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="78" y="166" width="310" height="72" rx="9" fill="#fff" stroke="#bfdbfe"/>
  <text x="98" y="193" class="boxTitle">index.html + style.css</text><text x="98" y="216" class="small">POS · Orders · Khata · Audit screens</text>
  <rect x="421" y="166" width="352" height="72" rx="9" fill="#fff" stroke="#bfdbfe"/>
  <text x="441" y="193" class="boxTitle">js/app.js</text><text x="441" y="216" class="small">Cart, preview, order submit, tables, actions</text>
  <rect x="836" y="166" width="672" height="72" rx="9" fill="#fff" stroke="#bfdbfe"/>
  <text x="858" y="193" class="boxTitle">HTTP requests</text><text x="858" y="216" class="small">GET /api/...  ·  POST /api/orders  ·  POST /api/pricing/preview</text>
  <path d="M388 202H417" class="edge"/><path d="M773 202H832" class="edge"/>

  <!-- routers -->
  <text x="56" y="303" class="section">EXPRESS ROUTERS · routes/</text>
  <rect x="55" y="319" width="1490" height="125" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <g>
    <rect x="78" y="342" width="335" height="78" rx="9" fill="#fff" stroke="#bbf7d0"/><text x="98" y="372" class="boxTitle">products.js</text><text x="98" y="397" class="small">/products · /coupons</text>
    <rect x="438" y="342" width="335" height="78" rx="9" fill="#fff" stroke="#4ade80" stroke-width="2"/><text x="458" y="372" class="boxTitle">orders.js</text><text x="458" y="397" class="small">/orders · create · cancel</text>
    <rect x="798" y="342" width="335" height="78" rx="9" fill="#fff" stroke="#bbf7d0"/><text x="818" y="372" class="boxTitle">customers.js</text><text x="818" y="397" class="small">/customers · settlements</text>
    <rect x="1158" y="342" width="363" height="78" rx="9" fill="#fff" stroke="#bbf7d0"/><text x="1178" y="372" class="boxTitle">reports.js</text><text x="1178" y="397" class="small">dashboard · GST · pricing preview · export</text>
  </g>
  <path d="M1250 261V314" class="edge"/>

  <!-- libs -->
  <text x="56" y="487" class="section">BUSINESS LOGIC · lib/</text>
  <rect x="55" y="503" width="1110" height="282" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="78" y="532" class="tiny">ORDER PLACEMENT PATH</text>
  <g>
    <rect x="78" y="550" width="190" height="68" rx="9" fill="#fff" stroke="#fcd34d"/><text x="98" y="578" class="boxTitle">inventory.js</text><text x="98" y="600" class="tiny">find · check · reserve</text>
    <rect x="293" y="550" width="190" height="68" rx="9" fill="#fff" stroke="#fcd34d"/><text x="313" y="578" class="boxTitle">pricing.js</text><text x="313" y="600" class="tiny">subtotal · totals</text>
    <rect x="508" y="550" width="190" height="68" rx="9" fill="#fff" stroke="#fcd34d"/><text x="528" y="578" class="boxTitle">coupons.js</text><text x="528" y="600" class="tiny">normalize · validate</text>
    <rect x="723" y="550" width="190" height="68" rx="9" fill="#fff" stroke="#fcd34d"/><text x="743" y="578" class="boxTitle">tax.js</text><text x="743" y="600" class="tiny">HSN rates · CGST/SGST</text>
    <rect x="938" y="550" width="190" height="68" rx="9" fill="#fff" stroke="#fcd34d"/><text x="958" y="578" class="boxTitle">ledger.js</text><text x="958" y="600" class="tiny">Khata charge / reversal</text>
    <rect x="250" y="676" width="220" height="68" rx="9" fill="#fff" stroke="#fcd34d"/><text x="270" y="704" class="boxTitle">orders.js</text><text x="270" y="726" class="tiny">add · get · cancel · list</text>
    <rect x="535" y="676" width="220" height="68" rx="9" fill="#fff" stroke="#fcd34d"/><text x="555" y="704" class="boxTitle">store.js</text><text x="555" y="726" class="tiny">read · write · audit log</text>
    <rect x="820" y="676" width="260" height="68" rx="9" fill="#fff" stroke="#fcd34d"/><text x="840" y="704" class="boxTitle">reports.js · invoice.js</text><text x="840" y="726" class="tiny">dashboard / reconciliation · HTML invoice</text>
  </g>
  <path d="M268 584H289" class="edge"/><path d="M483 584H504" class="edge"/><path d="M698 584H719" class="edge"/><path d="M913 584H934" class="edge"/>
  <path d="M535 618V653H360V672" class="edge"/><path d="M1030 618V651H645V672" class="edge"/>

  <!-- order route flow connectors -->
  <path d="M606 420V470H173V546" class="flow"/><text x="185" y="466" class="flowText">1 · validate product + stock</text>
  <path d="M606 420V476H388V546" class="flow"/><text x="395" y="490" class="flowText">2 · compute subtotal, coupon, GST</text>
  <path d="M606 420V485H1032V546" class="flow dash"/><text x="825" y="506" class="flowText">3 · charge Khata when selected</text>
  <path d="M606 420V641H360V672" class="flow"/><text x="370" y="663" class="flowText">4 · create order</text>
  <path d="M470 710H531" class="flow"/><text x="479" y="699" class="flowText">5 · persist</text>
  <path d="M535 744V761H420V785" class="flow"/>

  <!-- shared modules / config / data -->
  <rect x="1192" y="503" width="353" height="282" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="1215" y="532" class="section">SHARED FILES</text>
  <rect x="1215" y="550" width="307" height="68" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="1235" y="578" class="boxTitle">config.js</text><text x="1235" y="600" class="tiny">port · shop · tax slabs · coupons</text>
  <rect x="1215" y="640" width="307" height="68" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="1235" y="668" class="boxTitle">data/db.json</text><text x="1235" y="690" class="tiny">products · orders · customers · settlements</text>
  <rect x="1215" y="730" width="307" height="36" rx="8" fill="#fff" stroke="#c4b5fd"/><text x="1235" y="754" class="small">dates.js · date formatting / filtering</text>
  <path d="M1105 583H1188" class="edge dash"/><path d="M1105 710H1188" class="edge"/><path d="M1105 710H1175V748H1211" class="edge dash"/>
  <path d="M1368 618V636" class="edge"/>
  <text x="1192" y="817" class="tiny">Invoice page: server.js → orders.get → invoice.render</text>
  <path d="M1065 710H1144V837H1460V261" class="edge dash"/>

  <!-- flow legend -->
  <rect x="55" y="824" width="1110" height="116" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="78" y="854" class="section">ORDER FLOW · POST /api/orders</text>
  <text x="78" y="883" class="small">Browser sends cart → orders router resolves trusted product data → checks sellable stock → calculates coupon and HSN GST</text>
  <text x="78" y="907" class="small">→ optionally charges customer Khata → reserves stock and adds order → store writes db.json → response refreshes UI</text>
  <line x1="1210" y1="865" x2="1275" y2="865" class="flow"/><text x="1290" y="870" class="small">Order placement</text>
  <line x1="1210" y1="900" x2="1275" y2="900" class="edge dash"/><text x="1290" y="905" class="small">Shared / conditional call</text>
</svg>

